<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel wysyłki · zlecenialaser.pl</title>
<style>
:root{
  --bg:#f4f5f7; --card:#fff; --ink:#1c2230; --muted:#6b7385; --line:#e3e6ec;
  --head:#161b26; --laser:#ff5a1f; --laser-soft:#fff0ea;
  --ok:#1f9d55; --ok-soft:#e6f6ed; --bad:#c53030; --r:10px;
}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--head);color:#fff;padding:14px 22px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
header .logo{font-weight:700;font-size:17px}
header .logo span{color:var(--laser)}
header .beam{height:3px;flex:0 0 60px;background:linear-gradient(90deg,var(--laser),transparent);border-radius:2px}
header .spacer{flex:1}
header button{background:transparent;color:#cfd5e2;border:1px solid #39404f}
header button:hover{border-color:var(--laser);color:#fff}
nav{display:flex;gap:4px;padding:0 22px;background:var(--head);border-top:1px solid #262d3b}
nav button{background:none;border:none;color:#aab2c3;padding:12px 16px;border-bottom:3px solid transparent;border-radius:0;font-weight:600}
nav button.active{color:#fff;border-bottom-color:var(--laser)}
nav button .cnt{background:#2b3343;color:#cfd5e2;border-radius:20px;padding:1px 8px;font-size:12px;margin-left:6px}
main{padding:20px 22px;max-width:1200px;margin:0 auto}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--ink);padding:7px 12px}
button:hover{border-color:#c4c9d4}
button.primary{background:var(--laser);border-color:var(--laser);color:#fff;font-weight:600}
button.small{padding:4px 9px;font-size:13px}
button.ghost{border-color:transparent;background:transparent;color:var(--muted)}
button.ghost:hover{color:var(--bad)}
input,select,textarea{font:inherit;border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:#fff;color:var(--ink);width:100%}
textarea{resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--laser-soft);border-color:var(--laser)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar input{max-width:260px}
.toolbar select{max-width:180px}
.spacer{flex:1}
table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{background:#fafbfc;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.4px;font-weight:600;white-space:nowrap}
tr:last-child td{border-bottom:none}
td .sub{color:var(--muted);font-size:12px}
td.mail{font-family:ui-monospace,Consolas,monospace;font-size:13px}
.actions{white-space:nowrap;text-align:right}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:12px;font-weight:600;white-space:nowrap}
.b-new{background:#eef0f4;color:#4a5263}
.b-sent{background:var(--ok-soft);color:var(--ok)}
.empty{text-align:center;color:var(--muted);padding:40px}
.tpl{border:1px solid var(--line);border-radius:var(--r);padding:12px;background:#fff;margin-bottom:12px}
.tpl .row{display:flex;gap:8px;margin-bottom:8px;align-items:center;flex-wrap:wrap}
.tpl textarea{min-height:110px}
.tpl .lbl{font-size:12px;color:var(--muted);font-weight:600;min-width:42px}
.chips{display:flex;gap:6px}
.chips button.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.hint{color:var(--muted);font-size:12.5px}
h2{font-size:15px;margin:0 0 10px}
.found{max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:8px;margin:10px 0}
.found label{display:flex;gap:10px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--line)}
.found label:last-child{border-bottom:none}
.found input{width:auto}
.found .dup{color:var(--muted);text-decoration:line-through}
dialog{border:none;border-radius:14px;padding:0;width:min(620px,94vw);box-shadow:0 20px 60px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(15,20,30,.5)}
dialog .dh{padding:14px 18px;border-bottom:1px solid var(--line);font-weight:700;display:flex;justify-content:space-between;align-items:center}
dialog .db{padding:16px 18px;display:grid;gap:10px}
dialog .df{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
label.f{display:grid;gap:4px;font-size:12px;color:var(--muted);font-weight:600}
.preview{white-space:pre-wrap;background:#fafbfc;border:1px solid var(--line);border-radius:8px;padding:12px;max-height:260px;overflow:auto;font-size:13.5px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--head);color:#fff;padding:10px 18px;border-radius:8px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:99}
.toast.show{opacity:1}
@media(max-width:800px){.hide-m{display:none}}
</style>
</head>
<body>
<header>
  <div class="logo">zlecenia<span>laser</span>.pl</div>
  <div class="beam"></div>
  <div style="color:#aab2c3">Panel wysyłki</div>
  <div class="spacer"></div>
  <button onclick="exportJSON()">Kopia zapasowa</button>
  <button onclick="document.getElementById('importFile').click()">Wczytaj kopię</button>
  <input type="file" id="importFile" accept=".json" style="display:none" onchange="importJSON(this)">
</header>
<nav id="nav"></nav>
<main id="main"></main>

<dialog id="dlgContact">
  <form method="dialog" onsubmit="return false">
    <div class="dh"><span id="dcTitle">Nowy adres</span><button class="ghost" onclick="closeDlg('dlgContact')">✕</button></div>
    <div class="db">
      <label class="f">Nazwa (firma albo osoba)<input id="cName"></label>
      <label class="f">E-mail<input id="cEmail" type="email"></label>
      <label class="f">Skąd (np. nazwa grupy FB)<input id="cSource"></label>
      <label class="f">Notatka<textarea id="cNote" rows="2"></textarea></label>
    </div>
    <div class="df"><button onclick="closeDlg('dlgContact')">Anuluj</button><button class="primary" onclick="saveContact()">Zapisz</button></div>
  </form>
</dialog>

<dialog id="dlgSend">
  <form method="dialog" onsubmit="return false">
    <div class="dh"><span id="dsTitle">Napisz maila</span><button class="ghost" onclick="closeDlg('dlgSend')">✕</button></div>
    <div class="db">
      <label class="f">Szablon<select id="sTpl" onchange="renderSendPreview()"></select></label>
      <div><span class="hint">Temat:</span> <b id="sSubject"></b></div>
      <div class="preview" id="sPreview"></div>
      <div class="hint" id="sHint"></div>
    </div>
    <div class="df">
      <button onclick="copyFromSend('mail')">Kopiuj adres</button>
      <button onclick="copyFromSend('subject')">Kopiuj temat</button>
      <button onclick="copyFromSend('body')">Kopiuj treść</button>
      <button class="primary" onclick="openMail()">Otwórz w programie pocztowym</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast"></div>

<script>
const LS_KEY = 'zlecenialaser_panel_v2';
const GROUPS = {wyk:'Do firm z laserem', zle:'Do szukających cięcia'};

const DEFAULT_TEMPLATES = [
  {id:'A', group:'wyk', name:'Prosto', subject:'Zlecenia na cięcie laserem bez dopytywania', text:
`Dzień dobry, robię portal zlecenialaser.pl. Chcę, żeby zlecenia na cięcie przychodziły od razu kompletne: rysunek, materiał, grubość, ilość. Bez dopytywania o każdy szczegół. Zapraszam Waszą firmę do rejestracji na portalu. Wybieracie tylko te zlecenia, które Was interesują.`},
  {id:'B', group:'wyk', name:'Znam ten problem', subject:'Koniec z dopytywaniem klienta przed wyceną', text:
`Dzień dobry, pewnie znacie to dopytywanie klienta o każdy szczegół przed wyceną. Robię zlecenialaser.pl, żeby to się skończyło. Zlecenie od razu ma wszystko, co trzeba, a Wy tylko wyceniacie i tniecie. Zapraszam Waszą firmę do rejestracji, wybieracie tylko te zlecenia, które Was interesują.`},
  {id:'C', group:'wyk', name:'Jedno zdanie', subject:'Zlecenia na laser z kompletem danych', text:
`Dzień dobry, robię miejsce, gdzie zlecenia na laser przychodzą od razu z rysunkiem, materiałem i ilością, bez dopytywania. Zapraszam Waszą firmę do rejestracji na zlecenialaser.pl, wybieracie tylko te zlecenia, które Was interesują.`},
  {id:'E', group:'wyk', name:'Z filmem', subject:'Krótki film: zlecenia na cięcie laserem', text:
`Dzień dobry, nagrałem krótki film, jak działa zlecenialaser.pl:
{film}
Zlecenia przychodzą od razu z rysunkiem, materiałem i ilością, bez dopytywania.
Zapraszam Waszą firmę do rejestracji, wybieracie tylko te zlecenia, które Was interesują.`},
  {id:'FW', group:'wyk', name:'Przypomnienie', subject:'zlecenialaser.pl', text:
`Dzień dobry, wracam jeszcze do zlecenialaser.pl. Jak to nie dla Was, nie ma sprawy, więcej nie piszę.`},
  {id:'D', group:'zle', name:'Opisujesz raz', subject:'Cięcie laserem bez obdzwaniania firm', text:
`Dzień dobry, jeśli szukasz kogoś do cięcia laserem, wrzuć zlecenie na zlecenialaser.pl. Opisujesz raz, czego potrzebujesz, a firmy same się odzywają. Bez tłumaczenia wszystkiego od nowa każdej firmie.`},
  {id:'F', group:'zle', name:'Z filmem', subject:'Jak dodać zlecenie na cięcie laserem', text:
`Dzień dobry, tu krótki film, jak dodać zlecenie na cięcie laserem:
{film}
Opisujesz raz, czego potrzebujesz, a firmy same się odzywają. zlecenialaser.pl`},
  {id:'FZ', group:'zle', name:'Przypomnienie', subject:'zlecenialaser.pl', text:
`Dzień dobry, udało się już znaleźć kogoś do cięcia? Jak nie, wrzuć zlecenie na zlecenialaser.pl, to nic nie kosztuje.`}
];
const DEFAULT_SIGNATURE = `Pozdrawiam
Łukasz Orlikowski
zlecenialaser.pl`;

let state = load();
let view = 'tpl';
let tplFilter = 'all';
let filters = {q:'', status:'all'};
let found = [];
let editingId = null, sendingId = null;

function load(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw){
      const s = JSON.parse(raw);
      if(s && Array.isArray(s.contacts) && Array.isArray(s.templates)){
        s.settings = Object.assign({filmUrl:'', signature:DEFAULT_SIGNATURE, source:''}, s.settings||{});
        return s;
      }
    }
  }catch(e){}
  return {contacts:[], templates:JSON.parse(JSON.stringify(DEFAULT_TEMPLATES)), settings:{filmUrl:'', signature:DEFAULT_SIGNATURE, source:''}};
}
function save(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }
  catch(e){ toast('Nie udało się zapisać w przeglądarce. Zrób kopię zapasową.'); }
}
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const esc = s => String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today = () => new Date().toISOString().slice(0,10);
function fmtDate(d){ if(!d) return ''; const [y,m,dd]=d.split('-'); return `${dd}.${m}.${y}`; }
function tplById(id){ return state.templates.find(t=>t.id===id); }
function fillText(txt){
  const f = (state.settings.filmUrl||'').trim();
  if(f) return txt.split('{film}').join(f);
  return txt.split('\n').filter(l=>!l.includes('{film}')).join('\n');
}
function mailBody(t){
  const sig = (state.settings.signature||'').trim();
  return fillText(t.text) + (sig ? '\n\n' + sig : '');
}
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2200); }
function closeDlg(id){ document.getElementById(id).close(); }
async function copyText(txt, msg){
  let ok=false;
  try{ await navigator.clipboard.writeText(txt); ok=true; }
  catch(e){
    const ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta); ta.select();
    try{ ok=document.execCommand('copy'); }catch(_){}
    ta.remove();
  }
  toast(ok ? (msg||'Skopiowano') : 'Nie udało się skopiować');
  return ok;
}

// ---------- NAV ----------
function renderNav(){
  const items = [['tpl','Szablony'], ['mail', `Maile <span class="cnt">${state.contacts.length}</span>`]];
  document.getElementById('nav').innerHTML = items.map(([k,l]) =>
    `<button class="${view===k?'active':''}" onclick="go('${k}')">${l}</button>`).join('');
}
function go(v){ view=v; render(); }

// ---------- TEMPLATES ----------
function renderTemplates(){
  const list = state.templates.filter(t=>tplFilter==='all' || t.group===tplFilter);
  const chip = (k,l) => `<button class="${tplFilter===k?'active':''}" onclick="tplFilter='${k}';render()">${l}</button>`;
  return `
  <div class="toolbar">
    <div class="chips">${chip('all','Wszystkie')}${chip('wyk','Do firm z laserem')}${chip('zle','Do szukających cięcia')}</div>
    <div class="spacer"></div>
    <button onclick="resetTemplates()">Przywróć domyślne</button>
    <button class="primary" onclick="addTemplate()">+ Nowy szablon</button>
  </div>
  ${list.map(t=>`
    <div class="tpl">
      <div class="row">
        <input style="flex:1;min-width:160px;font-weight:600" value="${esc(t.name)}" onchange="updTpl('${t.id}','name',this.value)">
        <select style="width:auto" onchange="updTpl('${t.id}','group',this.value)">
          <option value="wyk" ${t.group==='wyk'?'selected':''}>${GROUPS.wyk}</option>
          <option value="zle" ${t.group==='zle'?'selected':''}>${GROUPS.zle}</option>
        </select>
        <button class="small primary" onclick="copyText(fillText(tplById('${t.id}').text),'Skopiowano treść')">Kopiuj treść</button>
        <button class="small" onclick="copyText(tplById('${t.id}').subject||'','Skopiowano temat')">Kopiuj temat</button>
        <button class="small ghost" onclick="delTemplate('${t.id}')" title="Usuń">✕</button>
      </div>
      <div class="row"><span class="lbl">Temat</span><input style="flex:1" value="${esc(t.subject||'')}" onchange="updTpl('${t.id}','subject',this.value)"></div>
      <textarea oninput="updTpl('${t.id}','text',this.value,true)">${esc(t.text)}</textarea>
    </div>`).join('') || '<div class="card empty">Brak szablonów.</div>'}
  <div class="card">
    <h2>Ustawienia</h2>
    <label class="f" style="margin-bottom:10px">🎬 Link do filmu (wstawiany w miejsce {film} w treści; bez linku ta linia znika)
      <input value="${esc(state.settings.filmUrl)}" placeholder="np. link do rolki na FB albo filmu na YouTube" onchange="state.settings.filmUrl=this.value.trim();save();toast('Zapisano')">
    </label>
    <label class="f">Podpis dodawany na końcu maili (przy „Kopiuj treść” w szablonach podpisu nie ma, żeby pasowało też do Messengera)
      <textarea rows="3" onchange="state.settings.signature=this.value;save();toast('Zapisano')">${esc(state.settings.signature)}</textarea>
    </label>
  </div>`;
}
function updTpl(id, field, val, silent){
  const t = tplById(id); if(!t) return;
  t[field]=val; save(); if(!silent) render();
}
function addTemplate(){
  const id = uid();
  state.templates.unshift({id, group: tplFilter==='zle'?'zle':'wyk', name:'Nowy szablon', subject:'', text:'Dzień dobry, '});
  save(); render();
}
function delTemplate(id){
  if(!confirm('Usunąć ten szablon?')) return;
  state.templates = state.templates.filter(t=>t.id!==id); save(); render();
}
function resetTemplates(){
  if(!confirm('Przywrócić domyślne szablony? Zmiany w nich zostaną nadpisane, Twoje nowe szablony zostaną.')) return;
  DEFAULT_TEMPLATES.forEach(d=>{
    const i = state.templates.findIndex(t=>t.id===d.id);
    const copy = JSON.parse(JSON.stringify(d));
    if(i>=0) state.templates[i] = copy; else state.templates.push(copy);
  });
  save(); render();
}

// ---------- EMAIL EXTRACTION ----------
const EMAIL_RE = /[A-Za-z0-9._%+-]+@[A-Za-z0-9-]+(?:\.[A-Za-z0-9-]+)*\.[A-Za-z]{2,}/g;
const EMAIL_ONE = new RegExp(EMAIL_RE.source);
const SKIP_LINE = /^(\*\s*)?(odpowiedz|udostępnij|edytowano|lubię to!?|reply|share|like)\s*$/i;
function cleanName(line){
  const m = line.match(/^\[([^\]]+)\]\(/);
  return (m ? m[1] : line).trim();
}
function isSep(line){ return /^[·•\s]+$/.test(line) && line.includes('·'); }
function extractEmails(text){
  const lines = text.split(/\r?\n/).map(l=>l.trim());
  const out = []; const seen = new Set();
  let name = '';
  for(let i=0;i<lines.length;i++){
    const l = lines[i];
    if(!l) continue;
    // a line followed by a "·" separator line is the author's name (Facebook comment layout)
    let j=i+1; while(j<lines.length && !lines[j]) j++;
    if(isSep(l) || SKIP_LINE.test(l)) continue;
    if(j<lines.length && isSep(lines[j]) && !EMAIL_ONE.test(l)){ name = cleanName(l); continue; }
    const ms = l.match(EMAIL_RE) || [];
    ms.forEach(e=>{
      e = e.replace(/\.+$/,'').toLowerCase();
      if(seen.has(e)) return; seen.add(e);
      out.push({email:e, name: name || guessName(e)});
    });
  }
  return out;
}
function guessName(e){
  const [local, dom] = e.split('@');
  const free = /^(gmail|onet|wp|o2|interia|op|yahoo|hotmail|outlook|icloud|poczta|tlen|vp|buziaczek|gazeta|protonmail)\./i;
  return free.test(dom) ? local : dom;
}

// ---------- MAILS ----------
function renderMails(){
  const all = state.contacts;
  const toSend = all.filter(c=>!c.sentAt);
  let list = all.filter(c=>{
    if(filters.status==='new' && c.sentAt) return false;
    if(filters.status==='sent' && !c.sentAt) return false;
    if(filters.q){ const q=filters.q.toLowerCase(); if(![c.name,c.email,c.source,c.note].join(' ').toLowerCase().includes(q)) return false; }
    return true;
  }).sort((a,b)=>(!!a.sentAt - !!b.sentAt) || (b.createdAt||'').localeCompare(a.createdAt||''));

  const existing = new Set(all.map(c=>c.email));
  const foundHtml = found.length ? `
    <div class="found">${found.map((f,i)=>{
      const dup = existing.has(f.email);
      return `<label><input type="checkbox" ${dup?'disabled':'checked'} data-i="${i}"><span class="${dup?'dup':''}" style="flex:1"><b>${esc(f.name)}</b> <span class="sub">${esc(f.email)}</span></span>${dup?'<span class="sub">już jest</span>':''}</label>`;
    }).join('')}</div>
    <div class="toolbar" style="margin:0">
      <input id="srcInput" style="max-width:280px" placeholder="Skąd (np. nazwa grupy FB)" value="${esc(state.settings.source)}">
      <div class="spacer"></div>
      <button onclick="found=[];render()">Anuluj</button>
      <button class="primary" onclick="addFound()">Dodaj zaznaczone</button>
    </div>` : '';

  const rows = list.map(c=>{
    const t = c.tpl ? tplById(c.tpl) : null;
    return `<tr>
      <td><b>${esc(c.name)}</b>${c.note?`<div class="sub">${esc(c.note)}</div>`:''}</td>
      <td class="mail">${esc(c.email)}</td>
      <td class="hide-m"><span class="sub">${esc(c.source)}</span></td>
      <td>${c.sentAt ? `<span class="badge b-sent" title="${t?esc(t.name):''}">wysłano ${fmtDate(c.sentAt)}</span>` : '<span class="badge b-new">do wysłania</span>'}</td>
      <td class="actions">
        <button class="small primary" onclick="openSend('${c.id}')">Napisz</button>
        <button class="small" onclick="toggleSent('${c.id}')">${c.sentAt?'Cofnij':'Oznacz wysłany'}</button>
        <button class="small" onclick="openContact('${c.id}')">Edytuj</button>
        <button class="small ghost" onclick="delContact('${c.id}')" title="Usuń">✕</button>
      </td></tr>`;
  }).join('');

  return `
  <div class="card">
    <h2>Zbierz maile</h2>
    <div class="hint" style="margin-bottom:8px">Wklej cały skopiowany tekst, np. komentarze spod posta na Facebooku. Panel sam wyciągnie adresy i dopasuje nazwę autora komentarza.</div>
    <textarea id="pasteBox" rows="5" placeholder="Wklej tutaj tekst z adresami e-mail…"></textarea>
    <div class="toolbar" style="margin:10px 0 0">
      <button class="primary" onclick="doExtract()">Wyciągnij maile</button>
      <button onclick="openContact()">+ Dodaj ręcznie</button>
    </div>
    ${foundHtml}
  </div>
  <div class="toolbar">
    <input placeholder="Szukaj…" value="${esc(filters.q)}" oninput="filters.q=this.value;renderKeepFocus('qInput')" id="qInput">
    <select onchange="filters.status=this.value;render()">
      <option value="all" ${filters.status==='all'?'selected':''}>Wszystkie (${all.length})</option>
      <option value="new" ${filters.status==='new'?'selected':''}>Do wysłania (${toSend.length})</option>
      <option value="sent" ${filters.status==='sent'?'selected':''}>Wysłane (${all.length-toSend.length})</option>
    </select>
    <div class="spacer"></div>
    <button onclick="copyText(toSend().map(c=>c.email).join(', '),'Skopiowano adresy do wysłania')">Kopiuj adresy do wysłania</button>
    <button onclick="exportCSV()">Eksport CSV</button>
  </div>
  ${list.length ? `<table>
    <thead><tr><th>Nazwa</th><th>E-mail</th><th class="hide-m">Skąd</th><th>Status</th><th></th></tr></thead>
    <tbody>${rows}</tbody></table>` : `<div class="card empty">${all.length?'Nic nie pasuje do filtra.':'Lista jest pusta. Wklej tekst z adresami powyżej.'}</div>`}`;
}
function toSend(){ return state.contacts.filter(c=>!c.sentAt); }
function renderKeepFocus(id){
  const el = document.getElementById(id); const pos = el?.selectionStart;
  const paste = document.getElementById('pasteBox')?.value;
  render();
  const pb = document.getElementById('pasteBox'); if(pb && paste) pb.value = paste;
  const n = document.getElementById(id); if(n){ n.focus(); try{n.setSelectionRange(pos,pos);}catch(e){} }
}
function doExtract(){
  const txt = document.getElementById('pasteBox').value;
  found = extractEmails(txt);
  if(!found.length){ toast('Nie znalazłem żadnego adresu e-mail'); return; }
  render();
  const pb = document.getElementById('pasteBox'); if(pb) pb.value = txt;
  toast(`Znaleziono ${found.length} adresów`);
}
function addFound(){
  const src = (document.getElementById('srcInput')?.value||'').trim();
  state.settings.source = src;
  const existing = new Set(state.contacts.map(c=>c.email));
  let n=0;
  document.querySelectorAll('.found input[type=checkbox]').forEach(cb=>{
    if(!cb.checked || cb.disabled) return;
    const f = found[+cb.dataset.i];
    if(existing.has(f.email)) return;
    existing.add(f.email);
    state.contacts.push({id:uid(), name:f.name, email:f.email, source:src, note:'', sentAt:'', tpl:'', createdAt:new Date().toISOString()});
    n++;
  });
  found = []; save(); render(); toast(`Dodano ${n} adresów`);
}
function openContact(id){
  editingId = id||null;
  const c = id ? state.contacts.find(x=>x.id===id) : {};
  document.getElementById('dcTitle').textContent = id ? 'Edytuj adres' : 'Nowy adres';
  cName.value=c.name||''; cEmail.value=c.email||''; cSource.value=c.source||state.settings.source||''; cNote.value=c.note||'';
  document.getElementById('dlgContact').showModal(); (id?cName:cEmail).focus();
}
function saveContact(){
  const email = cEmail.value.trim().toLowerCase();
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ toast('Podaj poprawny adres e-mail'); cEmail.focus(); return; }
  const data = {name:cName.value.trim()||guessName(email), email, source:cSource.value.trim(), note:cNote.value.trim()};
  if(editingId){ Object.assign(state.contacts.find(x=>x.id===editingId), data); }
  else{
    if(state.contacts.some(x=>x.email===email)){ toast('Ten adres już jest na liście'); return; }
    state.contacts.push(Object.assign({id:uid(), sentAt:'', tpl:'', createdAt:new Date().toISOString()}, data));
  }
  save(); closeDlg('dlgContact'); render(); toast('Zapisano');
}
function delContact(id){
  const c = state.contacts.find(x=>x.id===id);
  if(!confirm(`Usunąć ${c.email}?`)) return;
  state.contacts = state.contacts.filter(x=>x.id!==id); save(); render();
}
function toggleSent(id){
  const c = state.contacts.find(x=>x.id===id);
  c.sentAt = c.sentAt ? '' : today(); save(); render();
}

// ---------- SEND ----------
function openSend(id){
  sendingId = id;
  const c = state.contacts.find(x=>x.id===id);
  document.getElementById('dsTitle').textContent = 'Napisz do: ' + c.email;
  const opts = g => state.templates.filter(t=>t.group===g).map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('');
  sTpl.innerHTML = `<optgroup label="${GROUPS.wyk}">${opts('wyk')}</optgroup><optgroup label="${GROUPS.zle}">${opts('zle')}</optgroup>`;
  if(c.tpl && tplById(c.tpl)) sTpl.value = c.tpl;
  renderSendPreview();
  document.getElementById('dlgSend').showModal();
}
function renderSendPreview(){
  const t = tplById(sTpl.value);
  sSubject.textContent = t ? (t.subject||'') : '';
  sPreview.textContent = t ? mailBody(t) : '';
  sHint.textContent = (t && t.text.includes('{film}') && !(state.settings.filmUrl||'').trim()) ? 'Nie ustawiono linku do filmu (zakładka Szablony), linia z filmem zostanie pominięta.' : '';
}
function markSent(){
  const c = state.contacts.find(x=>x.id===sendingId);
  c.sentAt = today(); c.tpl = sTpl.value; save();
}
async function copyFromSend(what){
  const c = state.contacts.find(x=>x.id===sendingId);
  const t = tplById(sTpl.value);
  if(what==='mail') await copyText(c.email,'Skopiowano adres');
  if(what==='subject') await copyText(t.subject||'','Skopiowano temat');
  if(what==='body'){ await copyText(mailBody(t),'Skopiowano treść'); markSent(); render(); }
}
function openMail(){
  const c = state.contacts.find(x=>x.id===sendingId);
  const t = tplById(sTpl.value); if(!t) return;
  const url = `mailto:${encodeURIComponent(c.email)}?subject=${encodeURIComponent(t.subject||'')}&body=${encodeURIComponent(mailBody(t))}`;
  markSent(); closeDlg('dlgSend'); render();
  window.location.href = url;
}

// ---------- IMPORT / EXPORT ----------
function download(name, content, type){
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([content],{type})); a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function exportJSON(){ download(`panel-wysylki-${today()}.json`, JSON.stringify(state,null,2), 'application/json'); toast('Pobrano kopię zapasową'); }
function importJSON(input){
  const f = input.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const s = JSON.parse(r.result);
      if(!Array.isArray(s.contacts) || !Array.isArray(s.templates)) throw 0;
      if(!confirm(`Wczytać kopię (${s.contacts.length} adresów)? Obecne dane w tej przeglądarce zostaną zastąpione.`)) return;
      s.settings = Object.assign({filmUrl:'', signature:DEFAULT_SIGNATURE, source:''}, s.settings||{});
      state = s; save(); render(); toast('Wczytano kopię');
    }catch(e){ toast('To nie jest plik kopii z tego panelu'); }
    input.value='';
  };
  r.readAsText(f);
}
function exportCSV(){
  const q = v => `"${String(v??'').replace(/"/g,'""')}"`;
  const head = ['Nazwa','E-mail','Skąd','Wysłano','Szablon','Notatka'];
  const lines = state.contacts.map(c=>[c.name,c.email,c.source,c.sentAt,(tplById(c.tpl)||{}).name||'',c.note].map(q).join(';'));
  download(`maile-${today()}.csv`, '﻿'+[head.map(q).join(';'),...lines].join('\r\n'), 'text/csv;charset=utf-8');
}

// ---------- RENDER ----------
function render(){
  renderNav();
  document.getElementById('main').innerHTML = view==='mail' ? renderMails() : renderTemplates();
}
render();
</script>
</body>
</html>

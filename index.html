<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel wysyłki · zlecenialaser.pl</title>
<style>
:root{
  --bg:#f2f3f6; --card:#fff; --ink:#18202e; --muted:#667085; --line:#e3e6ec;
  --head:#141a26; --firm:#ff5a1f; --firm-soft:#fff1ea; --seek:#0d9488; --seek-soft:#e3f6f3;
  --hook:#4f46e5; --hook-soft:#eef0ff; --reply:#0284c7; --reply-soft:#e6f4fc; --follow:#c2770a; --follow-soft:#fdf3e1;
  --ok:#16a34a; --ok-soft:#e7f7ec; --bad:#c53030; --r:14px;
  --acc:var(--firm); --acc-soft:var(--firm-soft);
}
body.zle{--acc:var(--seek); --acc-soft:var(--seek-soft)}
*{box-sizing:border-box}
body{margin:0;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--head);color:#fff;padding:12px 28px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.logo{font-weight:800;font-size:20px;letter-spacing:.2px}
.logo span{color:var(--firm)}
.mainnav{display:flex;gap:6px;margin-left:12px}
.mainnav button{background:transparent;border:none;color:#aeb6c6;font-size:17px;font-weight:700;padding:10px 20px;border-radius:10px}
.mainnav button:hover{background:#222a3a;color:#fff}
.mainnav button.active{background:#fff;color:var(--head)}
.mainnav .cnt{display:inline-block;background:var(--firm);color:#fff;border-radius:20px;padding:0 9px;font-size:13px;margin-left:6px;line-height:22px}
header .spacer{flex:1}
header .tools button{background:transparent;color:#aeb6c6;border:1px solid #343c4d;font-size:13px;padding:6px 12px}
header .tools button:hover{color:#fff;border-color:#59627a}
main{padding:26px 28px 70px;max-width:1280px;margin:0 auto}
button{font:inherit;font-size:15px;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink);padding:8px 14px}
button:hover{border-color:#c4c9d4}
button.primary{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
button.primary.done{background:var(--ok);border-color:var(--ok)}
button.small{padding:5px 11px;font-size:14px}
button.ghost{border-color:transparent;background:transparent;color:var(--muted)}
button.ghost:hover{color:var(--ink)}
button.danger:hover{color:var(--bad)}
input,select,textarea{font:inherit;font-size:15px;border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:#fff;color:var(--ink);width:100%}
textarea{resize:vertical;line-height:1.55}
input:focus,select:focus,textarea:focus{outline:3px solid var(--acc-soft);border-color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:18px}
.spacer{flex:1}
.hint{color:var(--muted);font-size:14px}

.who{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
.who.who3{grid-template-columns:repeat(3,1fr)}
.who button.ordb.active{border-color:#7c3aed;background:#f3eefe}
.who button.ordb.active b{color:#6d28d9}
.ord-fields{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;align-content:start}
.ord-fields .f{margin:0}
.who button{display:flex;align-items:center;gap:14px;text-align:left;padding:16px 20px;border:2px solid var(--line);border-radius:var(--r);background:#fff}
.who button .ic{font-size:28px;line-height:1}
.who button b{display:block;font-size:19px}
.who button small{color:var(--muted);font-size:14px}
.who button.firm.active{border-color:var(--firm);background:var(--firm-soft)}
.who button.firm.active b{color:#c2410c}
.who button.seek.active{border-color:var(--seek);background:var(--seek-soft)}
.who button.seek.active b{color:#0f766e}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:20px}
.steps button{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:12px;border:2px solid transparent;background:#e7e9ee;font-weight:700;font-size:16px;color:#3b4456}
.steps .num{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:#fff;font-size:15px}
.steps .n{margin-left:auto;font-weight:600;color:var(--muted);font-size:14px}
.steps button.hook.active{background:var(--hook);color:#fff}
.steps button.reply.active{background:var(--reply);color:#fff}
.steps button.follow.active{background:var(--follow);color:#fff}
.steps button.mail.active{background:#7c3aed;color:#fff}
.steps button.active .num{color:var(--ink)}
.steps button.active .n{color:rgba(255,255,255,.85)}
.steps button:not(.active):hover{background:#dde0e7}
.stephint{margin:-8px 0 18px;color:var(--muted);font-size:15px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.stephint input{max-width:260px;margin-left:auto}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(400px,1fr));gap:18px}
@media(max-width:560px){.grid{grid-template-columns:1fr}}
.tpl{background:#fff;border:1px solid var(--line);border-top:5px solid var(--hook);border-radius:var(--r);display:flex;flex-direction:column;overflow:hidden}
.tpl.reply{border-top-color:var(--reply)} .tpl.follow{border-top-color:var(--follow)} .tpl.mail{border-top-color:#7c3aed}
.tpl-head{padding:16px 18px 0}
.tpl-name{font-weight:800;font-size:18px}
.tpl-subj{padding:4px 18px 0;font-size:14px;color:var(--muted)}
.tpl-subj b{color:var(--ink);font-weight:600}
.tpl-body{padding:12px 18px 16px;white-space:pre-wrap;font-size:16px;line-height:1.62;flex:1}
.tpl-body .sig{color:var(--muted)}
.tpl-body .feat{color:#3b4456}
.post-img{width:100%;display:block;aspect-ratio:1/1;object-fit:cover;background:#141a26}
.post-text{border:none;border-top:1px solid var(--line);border-radius:0;min-height:170px;padding:14px 18px;font-size:15px;line-height:1.6;flex:1}
.tpl-foot a{text-decoration:none}
.film{display:inline-flex;align-items:center;gap:6px;margin:0 18px 12px;padding:5px 10px;border-radius:8px;background:#fee2e2;color:#b91c1c;font-size:13px;font-weight:600;text-decoration:none;align-self:flex-start}
.tpl-foot{display:flex;align-items:center;gap:8px;padding:12px 18px;border-top:1px solid var(--line);background:#fafbfc}
.uses{font-size:13px;color:var(--muted)}
.tpl.editing{border-color:var(--acc);box-shadow:0 0 0 4px var(--acc-soft)}
.tpl.editing .fields{padding:16px 18px;display:grid;gap:12px}
.tpl.editing textarea{min-height:190px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label.f{display:grid;gap:5px;font-size:13px;color:var(--muted);font-weight:700}
details.card summary{cursor:pointer;font-weight:800;font-size:17px;list-style:none;display:flex;align-items:center;gap:10px}
details.card summary::-webkit-details-marker{display:none}
details.card summary::before{content:"+";display:inline-grid;place-items:center;width:26px;height:26px;border-radius:8px;background:var(--acc);color:#fff;font-weight:800}
details.card[open] summary::before{content:"−"}
details.card[open] summary{margin-bottom:14px}
.films{display:grid;gap:6px;margin:6px 0 12px}
.films div{display:flex;gap:8px;align-items:center;padding:6px 10px;border:1px solid var(--line);border-radius:10px;font-size:14px}
.films div span{flex:1}

.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.tabs2{display:inline-flex;gap:8px}
.tabs2 button{font-weight:700;font-size:16px;padding:10px 18px;border-radius:12px;border:2px solid var(--line);background:#fff}
.tabs2 button .n{margin-left:6px;font-weight:600;color:var(--muted)}
.tabs2 button.new.active{background:var(--firm);border-color:var(--firm);color:#fff}
.tabs2 button.sent.active{background:var(--ok);border-color:var(--ok);color:#fff}
.tabs2 button.active .n{color:rgba(255,255,255,.85)}
.search{max-width:260px}
table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
th,td{padding:13px 16px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{background:#fafbfc;color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.4px;font-weight:700}
tr:last-child td{border-bottom:none}
.nm{font-weight:700}
.em{font-family:ui-monospace,Consolas,monospace;font-size:14px;color:var(--muted)}
.actions{white-space:nowrap;text-align:right}
.badge{display:inline-block;padding:4px 10px;border-radius:20px;font-size:13px;font-weight:700;white-space:nowrap}
.b-new{background:var(--firm-soft);color:#c2410c}
.b-sent{background:var(--ok-soft);color:var(--ok)}
.empty{text-align:center;color:var(--muted);padding:48px}
.found{max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:10px;margin:12px 0}
.found label{display:flex;gap:10px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);font-size:15px}
.found label:last-child{border-bottom:none}
.found input{width:auto}
.found .dup{color:var(--muted);text-decoration:line-through}
dialog{border:none;border-radius:16px;padding:0;width:min(680px,94vw);box-shadow:0 20px 60px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(15,20,30,.5)}
dialog .dh{padding:16px 20px;border-bottom:1px solid var(--line);font-weight:800;font-size:17px;display:flex;justify-content:space-between;align-items:center}
dialog .db{padding:18px 20px;display:grid;gap:12px}
dialog .df{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.preview{white-space:pre-wrap;background:#fafbfc;border:1px solid var(--line);border-radius:10px;padding:16px;max-height:300px;overflow:auto;font-size:15px;line-height:1.6}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--head);color:#fff;padding:12px 20px;border-radius:10px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:99;font-size:15px}
.toast.show{opacity:1}
.cats{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.cats button{font-weight:700;font-size:15px;padding:9px 14px;border-radius:12px;border:2px solid var(--line);background:#fff}
.cats button .n{margin-left:6px;font-weight:600;color:var(--muted)}
.cats button.active{background:var(--acc);border-color:var(--acc);color:#fff}
.cats button.active .n{color:rgba(255,255,255,.85)}
.tpl.kom{border-top-color:var(--seek)}
.tpl.kom.wyk{border-top-color:var(--firm)}
.chip.aud{font-weight:800}
.chip.aud.wyk{background:var(--firm-soft);color:#c2410c}
.chip.aud.zle{background:var(--seek-soft);color:#0f766e}
.kom-box{border:2px solid var(--acc)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.chip{display:inline-block;padding:4px 11px;border-radius:20px;font-size:13px;font-weight:600;background:#eef0f4;color:#3b4456}
.chip.on{background:var(--seek-soft);color:#0f766e}
.kom-warn{background:#fdecec;color:var(--bad);border-radius:10px;padding:10px 14px;font-weight:600;margin-bottom:12px}
.kom-add{border:2px dashed var(--line);border-radius:var(--r);background:transparent;color:var(--muted);font-weight:700;min-height:120px}
.kom-add:hover{border-color:var(--acc);color:var(--acc)}
@media(max-width:800px){.hide-m{display:none}.row2,.who,.who.who3,.ord-fields{grid-template-columns:1fr}.steps{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <div class="logo">zlecenia<span>laser</span>.pl</div>
  <div class="mainnav" id="nav"></div>
  <div class="spacer"></div>
  <div class="tools">
    <button onclick="exportJSON()">Kopia zapasowa</button>
    <button onclick="document.getElementById('importFile').click()">Wczytaj kopię</button>
  </div>
  <input type="file" id="importFile" accept=".json" style="display:none" onchange="importJSON(this)">
</header>
<main id="main"></main>

<dialog id="dlgContact">
  <form method="dialog" onsubmit="return false">
    <div class="dh"><span id="dcTitle">Nowy adres</span><button class="ghost" onclick="closeDlg('dlgContact')">✕</button></div>
    <div class="db">
      <label class="f">Nazwa (firma albo osoba)<input id="cName"></label>
      <label class="f">E-mail<input id="cEmail" type="email"></label>
      <label class="f">Skąd (np. nazwa grupy FB)<input id="cSource"></label>
      <label class="f">Notatka<textarea id="cNote" rows="2"></textarea></label>
    </div>
    <div class="df"><button onclick="closeDlg('dlgContact')">Anuluj</button><button class="primary" onclick="saveContact()">Zapisz</button></div>
  </form>
</dialog>

<dialog id="dlgSend">
  <form method="dialog" onsubmit="return false">
    <div class="dh"><span id="dsTitle">Napisz maila</span><button class="ghost" onclick="closeDlg('dlgSend')">✕</button></div>
    <div class="db">
      <label class="f">Wiadomość<select id="sTpl" onchange="renderSendPreview()"></select></label>
      <div class="hint">Temat: <b id="sSubject" style="color:var(--ink)"></b></div>
      <div class="preview" id="sPreview"></div>
    </div>
    <div class="df">
      <button onclick="copyFromSend('mail')">Kopiuj adres</button>
      <button onclick="copyFromSend('subject')">Kopiuj temat</button>
      <button onclick="copyFromSend('body')">Kopiuj treść</button>
      <button class="primary" onclick="openMail()">Otwórz w poczcie</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast"></div>

function load(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw){
      const s = JSON.parse(raw);
      if(s && Array.isArray(s.contacts) && Array.isArray(s.templates)){
        s.settings = Object.assign({}, DEFAULT_SETTINGS, {tplVer:1, postVer:1, komVer:1}, s.settings||{});
        if(!Array.isArray(s.films)) s.films = JSON.parse(JSON.stringify(DEFAULT_FILMS));
        if(!Array.isArray(s.posts)) s.posts = JSON.parse(JSON.stringify(DEFAULT_POSTS));
        if(!Array.isArray(s.comments)) s.comments = JSON.parse(JSON.stringify(DEFAULT_COMMENTS));
        if(!Array.isArray(s.commented)) s.commented = [];
        if(!(s.settings.komVer >= 3)){
          DEFAULT_COMMENTS.forEach(d=>{ if(!s.comments.some(c=>c.id===d.id)) s.comments.push(Object.assign({}, d)); });
          s.settings.komVer = 3;
        }
        if(!(s.settings.postVer >= 2)){
          DEFAULT_POSTS.forEach(d=>{ if(!s.posts.some(p=>p.id===d.id)) s.posts.push(JSON.parse(JSON.stringify(d))); });
          s.settings.postVer = 2;
        }
        if(s.settings.tplVer === 3){
          s.templates.forEach(t=>{ const d = DEFAULT_TEMPLATES.find(x=>x.id===t.id); if(d && d.type==='hook') t.features = d.features; });
          s.settings.tplVer = 4;
        }
        if(s.settings.tplVer === 4){
          DEFAULT_TEMPLATES.forEach(d=>{ if(!s.templates.some(t=>t.id===d.id)) s.templates.push(JSON.parse(JSON.stringify(d))); });
          s.settings.tplVer = 5;
        }
        if(!(s.settings.komVer >= 4) || !(s.settings.postVer >= 3) || s.settings.tplVer === 5){
          const fx = v => typeof v==='string' ? v.split('zlecenialaser.pl/moje-konto').join('zlecenialaser.pl/rejestracja-firmy') : v;
          (s.templates||[]).forEach(t=>{ t.text = fx(t.text); t.subject = fx(t.subject); });
          (s.comments||[]).forEach(c=>{ c.text = fx(c.text); });
          (s.posts||[]).forEach(p=>{ Object.keys(p).forEach(k=>{ p[k] = fx(p[k]); }); });
          Object.keys(s.settings).forEach(k=>{ s.settings[k] = fx(s.settings[k]); });
          DEFAULT_COMMENTS.forEach(d=>{ if(!s.comments.some(c=>c.id===d.id)) s.comments.push(Object.assign({}, d)); });
          DEFAULT_TEMPLATES.forEach(d=>{ if(!s.templates.some(t=>t.id===d.id)) s.templates.push(JSON.parse(JSON.stringify(d))); });
          s.settings.komVer = 4; s.settings.postVer = 3; if(s.settings.tplVer === 5) s.settings.tplVer = 6;
        }
        if(s.settings.tplVer < 3){
          const OLD = ['A','B','C','D','E','F','FW','FZ'].concat(DEFAULT_TEMPLATES.map(t=>t.id), ['k1','k2','k3','k4','k5','k6','r1','r2','r3','r4','r5','f1','z1','z2','z3','zr1','zr2','zf1']);
          const uses = {}; s.templates.forEach(t=>{ if(t.uses) uses[t.id]=t.uses; });
          const own = s.templates.filter(t=>!OLD.includes(t.id)).map(t=>Object.assign({type:'hook'}, t, {text:(t.text||'').replace('{film}','')}));
          s.templates = JSON.parse(JSON.stringify(DEFAULT_TEMPLATES)).map(t=>Object.assign(t, uses[t.id]?{uses:uses[t.id]}:{})).concat(own);
          delete s.settings.signature; delete s.settings.filmUrl;
          s.settings.tplVer = TPL_VER;
        }
        return s;
      }
    }
  }catch(e){}
  return {contacts:[], templates:JSON.parse(JSON.stringify(DEFAULT_TEMPLATES)), films:JSON.parse(JSON.stringify(DEFAULT_FILMS)), posts:JSON.parse(JSON.stringify(DEFAULT_POSTS)), comments:JSON.parse(JSON.stringify(DEFAULT_COMMENTS)), commented:[], settings:Object.assign({}, DEFAULT_SETTINGS)};
}
function save(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }
  catch(e){ toast('Nie udało się zapisać w przeglądarce. Zrób kopię zapasową.'); }
}
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const esc = s => String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today = () => new Date().toISOString().slice(0,10);
function fmtDate(d){ if(!d) return ''; const [y,m,dd]=d.split('-'); return `${dd}.${m}.${y}`; }
function tplById(id){ return state.templates.find(t=>t.id===id); }
function filmById(id){ return state.films.find(f=>f.id===id); }
function bodyText(t){
  const f = t.film ? filmById(t.film) : null;
  if(f) return t.text.split('{film}').join(f.url);
  return t.text.split('\n').filter(l=>!l.includes('{film}')).join('\n');
}
function sigFor(t){
  if(t.type!=='hook' && t.type!=='mail') return '';
  return ((t.group==='zle' ? state.settings.sigZle : state.settings.sigWyk) || '').trim();
}
function featFor(t){
  if((t.type!=='hook' && t.type!=='mail') || !t.features) return '';
  return ((t.group==='zle' ? state.settings.featZle : state.settings.featWyk) || '').trim();
}
function fullText(t){ return [bodyText(t), featFor(t), sigFor(t)].filter(Boolean).join('\n\n'); }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2200); }
function closeDlg(id){ document.getElementById(id).close(); }
async function copyText(txt, msg){
  let ok=false;
  try{ await navigator.clipboard.writeText(txt); ok=true; }
  catch(e){
    const ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta); ta.select();
    try{ ok=document.execCommand('copy'); }catch(_){}
    ta.remove();
  }
  toast(ok ? (msg||'Skopiowano') : 'Nie udało się skopiować');
  return ok;
}

  document.getElementById('nav').innerHTML = items.map(([k,l,x]) =>
    `<button class="${view===k?'active':''}" onclick="go('${k}')">${l}${x}</button>`).join('');

const ORD_FIELDS = [
  ['title','Co to jest','np. Kryza ze stali nierdzewnej'],
  ['material','Materiał','np. Nierdzewna 304'],
  ['gr','Grubość','np. 10 mm'],
  ['qty','Ilość','np. 10 szt.'],
  ['loc','Lokalizacja','np. Kościan, woj. wielkopolskie'],
  ['termin','Termin','np. 20.11 albo pusto'],
  ['odbior','Odbiór','Wysyłka / Odbiór osobisty'],
  ['matBy','Materiał dostarcza','np. Materiał po stronie wykonawcy'],
  ['rys','Rysunek','np. rysunek w pliku JPG'],
  ['tech','Technologia','dowolna / laser fiber / plazma…']
];
let ord = {link:'', raw:'', nr:'', title:'', material:'', gr:'', qty:'', loc:'', termin:'', odbior:'', matBy:'', rys:'', tech:'', opis:'', offers:null};
function ordParse(){
  const o = ord, raw = (o.raw||'');
  const lm = (o.link + ' ' + raw).match(/(https?:\/\/)?(www\.)?zlecenialaser\.pl\/zlecenie\/([^\s\/?#]+)\/?/i);
  if(lm){ o.link = 'https://zlecenialaser.pl/zlecenie/' + lm[3] + '/'; const n = lm[3].match(/-(\d+)$/); if(n) o.nr = n[1];
    if(!o.title){ const w = lm[3].replace(/-\d+$/,'').replace(/-/g,' '); o.title = w.charAt(0).toUpperCase() + w.slice(1); } }
  if(!raw.trim()) return;
  const text = raw.split(/Inne aktualne zlecenia/i)[0];
  const L = text.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
  const hi = L.findIndex(l=>/Zlecenie nr\s*\d+/i.test(l));
  const after = lab => { const i = L.findIndex(l=>l.toLowerCase()===lab); return i>=0 && L[i+1] ? L[i+1] : ''; };
  if(hi>=0){
    const h = L[hi], m = h.match(/Zlecenie nr\s*(\d+)\s*,?\s*(.*)$/i);
    if(m){ o.nr = m[1]; const parts = m[2].split(',').map(s=>s.trim()).filter(p=>p && !/dodane|temu|^\d/i.test(p)); if(parts.length) o.loc = parts.join(', '); }
    if(L[hi+1]) o.title = L[hi+1];
    o.gr = ''; o.qty = ''; o.material = '';
    for(let i=hi+2; i<Math.min(L.length, hi+7); i++){
      const l = L[i];
      if(/^opis$/i.test(l) || /^rysunek|^bez rysunku/i.test(l)) break;
      if(!o.gr && /^\d+([.,]\d+)?\s*mm$/i.test(l)) o.gr = l.replace(/\s*mm$/i,' mm');
      else if(!o.qty && /^\d+\s*szt/i.test(l)) o.qty = l;
      else if(!o.material) o.material = l;
    }
  }
  const rm = text.match(/Rysunek jest w pliku\s+(\w+)/i);
  o.rys = rm ? 'rysunek w pliku ' + rm[1].toUpperCase() : (/bez rysunku/i.test(L.slice(0, hi>=0?hi+1:3).join(' ')) ? 'bez rysunku' : (/\bdxf\b/i.test(text) ? 'plik DXF' : o.rys));
  o.tech = after('technologia') || o.tech;
  o.matBy = after('materiał dostarcza') || o.matBy;
  o.odbior = after('odbiór') || o.odbior;
  const t = after('termin');
  if(t){ if(/bez terminu/i.test(t)) o.termin = ''; else { const d = t.match(/(\d{1,2})\.(\d{1,2})\.(\d{4})/); o.termin = d ? (d[3]==String(new Date().getFullYear()) ? d[1].padStart(2,'0')+'.'+d[2].padStart(2,'0') : d[1].padStart(2,'0')+'.'+d[2].padStart(2,'0')+'.'+d[3]) : t.replace(/\s*\(.*\)$/,''); } }
  if(!o.loc) o.loc = after('lokalizacja');
  const oi = L.findIndex(l=>l.toLowerCase()==='opis');
  if(oi>=0){ const stop = /^(technologia|materiał dostarcza|odbiór|termin|lokalizacja|zleceniodawca)$/i; const op=[]; for(let i=oi+1;i<L.length && !stop.test(L[i]);i++) op.push(L[i]); o.opis = op.join(' '); }
  const om = text.match(/Oferty wykonawców\s*(\d+)/i); o.offers = om ? +om[1] : null;
}
function ordLow(s){ s = (s||'').trim(); return /^[A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]/.test(s) ? s[0].toLowerCase()+s.slice(1) : s; }
function ordDot(s){ return /[.!?]$/.test(s) ? s : s + '.'; }
function ordTexts(){
  const o = ord, link = o.link || 'zlecenialaser.pl/zlecenia';
  const spec = [o.material && ordLow(o.material), o.gr, o.qty].filter(Boolean).join(', ');
  const title0 = (o.title||'Nowe zlecenie na cięcie').trim();
  const title = (o.gr ? title0.replace(/\s*\b\d+([.,]\d+)?\s?mm\b/gi,'') : title0).trim() || title0;
  const matTok = (o.material||'').toLowerCase().split(/[^a-z0-9ąćęłńóśźż]+/).filter(t=>t.length>=3);
  const matInTitle = matTok.length && matTok.every(t=>title.toLowerCase().includes(/\d/.test(t) ? t : t.slice(0,6)));
  const sspec = [!matInTitle && o.material && ordLow(o.material), o.gr, o.qty].filter(Boolean).join(', ');
  const ship = /wysy/i.test(o.odbior), pick = /osobi/i.test(o.odbior);
  const woj = ((o.loc||'').match(/woj\.\s*([a-ząćęłńóśźż-]+)/i)||[])[1] || '';
  const wojGen = woj ? woj.replace(/ie$/,'iego') : '';
  const tech = o.tech && !/dowoln/i.test(o.tech) ? o.tech : '';
  const machine = /plazm/i.test(tech) ? 'plazmie' : /water|wod/i.test(tech) ? 'waterjecie' : /gię|gie/i.test(tech) ? 'prasie' : 'laserze';
  const termin = o.termin ? 'termin ' + o.termin : '';
  const shipNote = ship ? 'Klient chce wysyłkę, więc nie musicie być z okolicy.' : pick ? 'Odbiór osobisty, więc najlepiej dla firm z okolicy.' : '';
  const titleWords = (title+' '+spec).toLowerCase();
  const extra = (o.opis||'').split(/[^a-ząćęłńóśźż]+/i).filter(w=>w.length>3 && !/grubo|sztuk|szt|mm/i.test(w) && !titleWords.includes(w.toLowerCase()));
  const opisLine = o.opis && o.opis.length<=200 && extra.length>=3 ? `💬 „${o.opis}”` : '';
  const v = [];
  v.push(['Konkret z ikonkami', [
    'Nowe zlecenie na zlecenialaser.pl 🔥', title0,
    spec && '🔩 ' + spec,
    (o.loc || o.odbior) && '📍 ' + [o.loc, ship?'odbiór wysyłką':pick?'odbiór osobisty':ordLow(o.odbior)].filter(Boolean).join(', '),
    '📅 ' + (o.termin ? 'termin: ' + o.termin : 'bez sztywnego terminu'),
    [o.rys, o.matBy && ordLow(o.matBy)].filter(Boolean).length ? '📎 ' + [o.rys, o.matBy && ordLow(o.matBy)].filter(Boolean).join(', ') : '',
    tech && '⚙️ technologia: ' + ordLow(tech),
    opisLine,
    'Kontakt do klienta zobaczy najwyżej 5 firm.',
    '👉 ' + link].filter(Boolean).join('\n')]);
  v.push(['Pytanie do grupy', `Wolne moce na ${machine}? Jest nowe zlecenie: ${ordLow(title)}${sspec?' ('+sspec+')':''}${termin?', '+termin:''}. ${shipNote}${shipNote?' ':''}Szczegóły${/rysunek|dxf/i.test(o.rys)?' i rysunek':''}:\n${link}`]);
  v.push(['Krótko', ordDot(`Świeże zlecenie: ${ordLow(title)}${sspec?', '+sspec:''}${termin?', '+termin:''}${ship?', wysyłka':''}`) + `\n${link}`]);
  if(wojGen) v.push(['Z regionu', ordDot(`Ktoś z ${wojGen} albo okolic? Nowe zlecenie na cięcie: ${ordLow(title)}${sspec?', '+sspec:''}${termin?', '+termin:''}`) + `${ship?' Odbiór wysyłką, więc firmy z innych województw też mogą brać.':''}\n${link}`]);
  v.push(['Zlecenie i zaproszenie do konta', ordDot(`Nowe zlecenie na cięcie: ${ordLow(title)}${sspec?', '+sspec:''}${o.loc?', '+o.loc:''}${termin?', '+termin:''}`) + `\nTakie zlecenia mogą przychodzić Wam od razu na maila: zakładacie konto na zlecenialaser.pl/rejestracja-firmy i zaznaczacie województwa, które Was interesują.\nTo zlecenie: ${link}`]);
  if(o.offers===0) v.push(['Na razie bez ofert', ordDot(`Pierwsza oferta ma największą szansę, a do tego zlecenia jeszcze nikt jej nie złożył: ${ordLow(title)}${sspec?', '+sspec:''}${termin?', '+termin:''}`) + `\n${link}`]);
  return v;
}

const KOM_FIRM = /wolne moce|moc(e|y) przerob|przyjm(ę|e|iemy|ujemy) zleceni|szuka(m|my) zlece[nń]|oferuj(ę|e|emy)|[śs]wiadcz|us[łl]ug[aiy]? ci[eę]cia|dysponuj|posiada(m|my) (laser|wycinark)|mamy (wolny|laser|wycinark)|tniemy|wytniemy|zaprasza(m|my) do wsp[oó][łl]pracy|nawi[aą][zż]emy wsp/i;
const KOM_SEEK = /kto (wytnie|zrobi|potnie)|szukam (kogo|firm)|potrzebuj|polec(ie|i)cie|gdzie (wytn|zleci)/i;
const KOM_INFO = [
  ['nierdzewka', /nierdzew|\binox|kwasoodp/i], ['aluminium', /\balu/i], ['ocynk', /ocynk/i],
  ['stal czarna', /stal czarn|czarn[aą] stal|\bdc0?1\b|\bs235|\bs355/i], ['mosiądz / miedź', /mosi[aą]dz|mied[zź]/i],

let komGroup = 'zle', komCat = 'ogolne', komPost = '', komUrl = '', komAlt = {}, komForce = '';
function komAnalyze(text){
  const aud = komForce || (KOM_FIRM.test(text) && !KOM_SEEK.test(text) ? 'wyk' : 'zle');
  const cats = (aud==='wyk' ? KOM_RULES_WYK : KOM_RULES).filter(([,re])=>re.test(text)).map(([k])=>k);
  if(cats.includes('bezrys') && cats.includes('dxf')) cats.splice(cats.indexOf('dxf'), 1);
  const info = KOM_INFO.filter(([,re])=>re.test(text)).map(([k])=>k);
  const mm = text.match(/(\d+(?:[.,]\d+)?)\s?mm\b/i); if(mm) info.push('grubość ' + mm[1] + ' mm');
  const low = text.toLowerCase();
  WOJ.forEach(w=>{ if(new RegExp('(?<![a-ząćęłńóśźż-])' + w.slice(0, w.length-3)).test(low)) info.push('woj. ' + w); });
  if(aud==='wyk' && !cats.includes('region') && info.some(i=>i.startsWith('woj.'))) cats.push('region');
  return {aud, cats, info};
}
function komNorm(u){
  u = (u||'').trim(); if(!u) return '';
  try{ const x = new URL(u.startsWith('http')?u:'https://'+u); return (x.hostname.replace(/^(www|m|web)\./,'') + x.pathname).replace(/\/+$/,'').toLowerCase(); }
  catch(e){ return u.toLowerCase(); }
}
function komDone(u){ const n = komNorm(u); return n ? state.commented.find(c=>komNorm(c.url)===n) : null; }
function komPick(cat){
  const list = state.comments.filter(c=>c.cat===cat);
  if(!list.length) return null;
  let base = 0; list.forEach((c,i)=>{ if((c.uses||0) < (list[base].uses||0)) base = i; });
  return list[(base + (komAlt[cat]||0)) % list.length];
}

}

async function copyKom(id, btn){
  const c = state.comments.find(x=>x.id===id); if(!c) return;
  if(!(await copyText(c.text,'Skopiowano komentarz'))) return;
  c.uses = (c.uses||0)+1;
  if(komUrl.trim() && !komDone(komUrl)) state.commented.push({id:uid(), url:komUrl.trim(), at:today(), ts:Date.now(), text:c.text});
  save();
  btn.textContent='✓ Skopiowano'; btn.classList.add('done');
  setTimeout(()=>render(), 1200);
}

  if(!confirm('Przywrócić domyślne komentarze? Zmiany w nich zostaną nadpisane, Twoje własne zostaną.')) return;
  DEFAULT_COMMENTS.forEach(d=>{ const i = state.comments.findIndex(c=>c.id===d.id); const copy = Object.assign({}, d); if(i>=0){ copy.uses = state.comments[i].uses; state.comments[i] = copy; } else state.comments.push(copy); });

}

// ---------- EMAIL EXTRACTION ----------
const EMAIL_RE = /[A-Za-z0-9._%+-]+@[A-Za-z0-9-]+(?:\.[A-Za-z0-9-]+)*\.[A-Za-z]{2,}/g;
const EMAIL_ONE = new RegExp(EMAIL_RE.source);
const SKIP_LINE = /^(\*\s*)?(odpowiedz|udostępnij|edytowano|lubię to!?|reply|share|like)\s*$/i;
function cleanName(line){
  const m = line.match(/^\[([^\]]+)\]\(/);
  return (m ? m[1] : line).trim();
}
function isSep(line){ return /^[·•\s]+$/.test(line) && line.includes('·'); }
function extractEmails(text){
  const lines = text.split(/\r?\n/).map(l=>l.trim());
  const out = []; const seen = new Set();
  let name = '';
  for(let i=0;i<lines.length;i++){
    const l = lines[i];
    if(!l) continue;
    // a line followed by a "·" separator line is the author's name (Facebook comment layout)
    let j=i+1; while(j<lines.length && !lines[j]) j++;
    if(isSep(l) || SKIP_LINE.test(l)) continue;
    if(j<lines.length && isSep(lines[j]) && !EMAIL_ONE.test(l)){ name = cleanName(l); continue; }
    const ms = l.match(EMAIL_RE) || [];
    ms.forEach(e=>{
      e = e.replace(/\.+$/,'').toLowerCase();
      if(seen.has(e)) return; seen.add(e);
      out.push({email:e, name: name || guessName(e)});
    });
  }
  return out;
}
function guessName(e){
  const [local, dom] = e.split('@');
  const free = /^(gmail|onet|wp|o2|interia|op|yahoo|hotmail|outlook|icloud|poczta|tlen|vp|buziaczek|gazeta|protonmail)\./i;
  return free.test(dom) ? local : dom;
}

function addFound(){
  const src = (document.getElementById('srcInput')?.value||'').trim();
  state.settings.source = src;
  const existing = new Set(state.contacts.map(c=>c.email));
  let n=0;
  document.querySelectorAll('.found input[type=checkbox]').forEach(cb=>{
    if(!cb.checked || cb.disabled) return;
    const f = found[+cb.dataset.i];
    if(existing.has(f.email)) return;
    existing.add(f.email);
    state.contacts.push({id:uid(), name:f.name, email:f.email, source:src, note:'', sentAt:'', tpl:'', createdAt:new Date().toISOString()});
    n++;
  });
  found = []; filters.status='new'; save(); render(); toast(`Dodano ${n} adresów`);
}
function openContact(id){
  editingId = id||null;
  const c = id ? state.contacts.find(x=>x.id===id) : {};
  document.getElementById('dcTitle').textContent = id ? 'Edytuj adres' : 'Nowy adres';
  cName.value=c.name||''; cEmail.value=c.email||''; cSource.value=c.source||state.settings.source||''; cNote.value=c.note||'';
  document.getElementById('dlgContact').showModal(); (id?cName:cEmail).focus();
}
function saveContact(){
  const email = cEmail.value.trim().toLowerCase();
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ toast('Podaj poprawny adres e-mail'); cEmail.focus(); return; }
  const data = {name:cName.value.trim()||guessName(email), email, source:cSource.value.trim(), note:cNote.value.trim()};
  if(editingId){ Object.assign(state.contacts.find(x=>x.id===editingId), data); }
  else{
    if(state.contacts.some(x=>x.email===email)){ toast('Ten adres już jest na liście'); return; }
    state.contacts.push(Object.assign({id:uid(), sentAt:'', tpl:'', createdAt:new Date().toISOString()}, data));
  }
  save(); closeDlg('dlgContact'); render(); toast('Zapisano');
}
function delContact(id){
  const c = state.contacts.find(x=>x.id===id);
  if(!confirm(`Usunąć ${c.email}?`)) return;
  state.contacts = state.contacts.filter(x=>x.id!==id); save(); render();
}
function toggleSent(id){
  const c = state.contacts.find(x=>x.id===id);
  c.sentAt = c.sentAt ? '' : today(); save(); render();
}

function openSend(id){
  sendingId = id;
  const c = state.contacts.find(x=>x.id===id);
  document.getElementById('dsTitle').textContent = 'Napisz do: ' + (c.name || c.email);
  let html = '';
  for(const [g,gl] of Object.entries(GROUPS)) for(const [ty,tl] of Object.entries(TYPES)){
    const ts = state.templates.filter(t=>t.group===g && t.type===ty);
    if(ts.length) html += `<optgroup label="${gl}: ${tl}">${ts.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('')}</optgroup>`;
  }
  sTpl.innerHTML = html;
  const last = tplById(state.settings.lastTpl);
  const pick = c.sentAt ? ((tplById('m8') ? 'm8' : (state.templates.find(t=>t.group==='wyk' && t.type==='follow')||{}).id)) : (last && last.type==='mail' ? last.id : (tplById('m1') ? 'm1' : (state.settings.lastTpl || 'k1')));

  document.getElementById('dlgSend').showModal();

function renderSendPreview(){
  const t = tplById(sTpl.value);
  sSubject.textContent = t ? (t.subject||'(bez tematu)') : '';
  sPreview.textContent = t ? fullText(t) : '';
}
function markSent(){
  const c = state.contacts.find(x=>x.id===sendingId);
  const t = tplById(sTpl.value);
  if(!c.sentAt) c.sentAt = today();
  if(t && (t.type==='hook' || (t.type==='mail' && t.id!=='m8'))){ c.tpl = t.id; state.settings.lastTpl = t.id; }
  if(t) t.uses = (t.uses||0)+1;
  save();
}
async function copyFromSend(what){
  const c = state.contacts.find(x=>x.id===sendingId);
  const t = tplById(sTpl.value);
  if(what==='mail') await copyText(c.email,'Skopiowano adres');
  if(what==='subject') await copyText(t.subject||'','Skopiowano temat');
  if(what==='body'){ await copyText(fullText(t),'Skopiowano treść'); markSent(); render(); }

function openMail(){
  const c = state.contacts.find(x=>x.id===sendingId);
  const t = tplById(sTpl.value); if(!t) return;
  const url = `mailto:${encodeURIComponent(c.email)}?subject=${encodeURIComponent(t.subject||'')}&body=${encodeURIComponent(fullText(t))}`;
  markSent(); closeDlg('dlgSend'); render();
  window.location.href = url;
}

function download(name, content, type){
  const a=document.createElement('a'); a.href=URL.createObjectURL(content instanceof Blob ? content : new Blob([content],{type})); a.download=name;
  a.style.display='none'; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },4000);
}
// ---------- XLSX (bez bibliotek) ----------
const CRC_T = (()=>{ const t=new Uint32Array(256); for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c = c&1 ? 0xEDB88320^(c>>>1) : c>>>1; t[n]=c>>>0; } return t; })();
function crc32(b){ let c=0xFFFFFFFF; for(let i=0;i<b.length;i++) c = CRC_T[(c^b[i])&255]^(c>>>8); return (c^0xFFFFFFFF)>>>0; }
function zipStore(files){
  const enc=new TextEncoder(), parts=[], cen=[]; let off=0;
  const u16=v=>[v&255,(v>>>8)&255], u32=v=>[v&255,(v>>>8)&255,(v>>>16)&255,(v>>>24)&255];
  files.forEach(([name,txt])=>{
    const nb=enc.encode(name), db=enc.encode(txt), crc=crc32(db);
    const head=[...u32(0x04034b50),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(crc),...u32(db.length),...u32(db.length),...u16(nb.length),...u16(0)];
    parts.push(new Uint8Array(head), nb, db);
    cen.push(new Uint8Array([...u32(0x02014b50),...u16(20),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(crc),...u32(db.length),...u32(db.length),...u16(nb.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(off)]), nb);
    off += head.length + nb.length + db.length;
  });
  const cenLen = cen.reduce((a,b)=>a+b.length,0);
  const end = new Uint8Array([...u32(0x06054b50),...u16(0),...u16(0),...u16(files.length),...u16(files.length),...u32(cenLen),...u32(off),...u16(0)]);
  return new Blob([...parts,...cen,end],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}
function xlsxBlob(rows, widths){
  const x = v => String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,'');
  const col = i => { let s=''; i++; while(i){ const m=(i-1)%26; s=String.fromCharCode(65+m)+s; i=Math.floor((i-1)/26); } return s; };
  const sheet = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><cols>'
    + widths.map((w,i)=>`<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join('') + '</cols><sheetData>'
    + rows.map((r,ri)=>`<row r="${ri+1}">` + r.map((v,ci)=>`<c r="${col(ci)}${ri+1}" t="inlineStr"${ri===0?' s="1"':''}><is><t xml:space="preserve">${x(v)}</t></is></c>`).join('') + '</row>').join('')
    + `</sheetData><autoFilter ref="A1:${col(rows[0].length-1)}${rows.length}"/></worksheet>`;
  return zipStore([
    ['[Content_Types].xml','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>'],
    ['_rels/.rels','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>'],
    ['xl/workbook.xml','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="Maile" sheetId="1" r:id="rId1"/></sheets><definedNames><definedName name="_xlnm._FilterDatabase" localSheetId="0" hidden="1">Maile!$A$1:$'+col(rows[0].length-1)+'$'+rows.length+'</definedName></definedNames></workbook>'],
    ['xl/_rels/workbook.xml.rels','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>'],
    ['xl/styles.xml','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>'],
    ['xl/worksheets/sheet1.xml', sheet]
  ]);
}
function exportJSON(){ download(`panel-wysylki-${today()}.json`, JSON.stringify(state,null,2), 'application/json'); toast('Pobrano kopię zapasową'); }
function importJSON(input){
  const f = input.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const s = JSON.parse(r.result);
      if(!Array.isArray(s.contacts) || !Array.isArray(s.templates)) throw 0;
      if(!confirm(`Wczytać kopię (${s.contacts.length} adresów)? Obecne dane w tej przeglądarce zostaną zastąpione.`)) return;
      localStorage.setItem(LS_KEY, JSON.stringify(s));
      state = load(); save(); render(); toast('Wczytano kopię');
    }catch(e){ toast('To nie jest plik kopii z tego panelu'); }
    input.value='';
  };
  r.readAsText(f);
}
function exportCSV(){
  const q = v => `"${String(v??'').replace(/"/g,'""')}"`;
  const head = ['Nazwa','E-mail','Skąd','Wysłano','Wiadomość','Notatka'];
  const lines = state.contacts.map(c=>[c.name,c.email,c.source,c.sentAt,(tplById(c.tpl)||{}).name||'',c.note].map(q).join(';'));
  download(`maile-${today()}.csv`, '﻿'+[head.map(q).join(';'),...lines].join('\r\n'), 'text/csv;charset=utf-8');
}
function exportXLSX(){
  if(!state.contacts.length){ toast('Lista maili jest pusta'); return; }
  const rows = [['Nazwa','E-mail','Status','Wysłano','Skąd','Wiadomość','Notatka']].concat(
    state.contacts.map(c=>[c.name||'', c.email, c.sentAt?'wysłany':'do wysłania', c.sentAt?fmtDate(c.sentAt):'', c.source||'', (tplById(c.tpl)||{}).name||'', c.note||'']));
  download(`maile-zlecenialaser-${today()}.xlsx`, xlsxBlob(rows,[28,34,14,12,30,26,30]));
  toast('Pobrano plik Excel ('+state.contacts.length+' adresów)');
}

// ---------- RENDER ----------
function render(){
  renderNav();
  document.getElementById('main').innerHTML = view==='mail' ? renderMails() : view==='posts' ? renderPosts() : view==='kom' ? renderComments() : renderTemplates();
}
render();

<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel wysyłki · zlecenialaser.pl</title>
<style>
:root{
  --bg:#f2f3f6; --card:#fff; --ink:#18202e; --muted:#667085; --line:#e3e6ec;
  --head:#141a26; --firm:#ff5a1f; --firm-soft:#fff1ea; --seek:#0d9488; --seek-soft:#e3f6f3;
  --hook:#4f46e5; --hook-soft:#eef0ff; --reply:#0284c7; --reply-soft:#e6f4fc; --follow:#c2770a; --follow-soft:#fdf3e1;
  --ok:#16a34a; --ok-soft:#e7f7ec; --bad:#c53030; --r:14px;
  --acc:var(--firm); --acc-soft:var(--firm-soft);
}
body.zle{--acc:var(--seek); --acc-soft:var(--seek-soft)}
*{box-sizing:border-box}
body{margin:0;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--head);color:#fff;padding:12px 28px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.logo{font-weight:800;font-size:20px;letter-spacing:.2px}
.logo span{color:var(--firm)}
.mainnav{display:flex;gap:6px;margin-left:12px}
.mainnav button{background:transparent;border:none;color:#aeb6c6;font-size:17px;font-weight:700;padding:10px 20px;border-radius:10px}
.mainnav button:hover{background:#222a3a;color:#fff}
.mainnav button.active{background:#fff;color:var(--head)}
.mainnav .cnt{display:inline-block;background:var(--firm);color:#fff;border-radius:20px;padding:0 9px;font-size:13px;margin-left:6px;line-height:22px}
header .spacer{flex:1}
header .tools button{background:transparent;color:#aeb6c6;border:1px solid #343c4d;font-size:13px;padding:6px 12px}
header .tools button:hover{color:#fff;border-color:#59627a}
main{padding:26px 28px 70px;max-width:1280px;margin:0 auto}
button{font:inherit;font-size:15px;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink);padding:8px 14px}
button:hover{border-color:#c4c9d4}
button.primary{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
button.primary.done{background:var(--ok);border-color:var(--ok)}
button.small{padding:5px 11px;font-size:14px}
button.ghost{border-color:transparent;background:transparent;color:var(--muted)}
button.ghost:hover{color:var(--ink)}
button.danger:hover{color:var(--bad)}
input,select,textarea{font:inherit;font-size:15px;border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:#fff;color:var(--ink);width:100%}
textarea{resize:vertical;line-height:1.55}
input:focus,select:focus,textarea:focus{outline:3px solid var(--acc-soft);border-color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:18px}
.spacer{flex:1}
.hint{color:var(--muted);font-size:14px}

.who{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
.who button{display:flex;align-items:center;gap:14px;text-align:left;padding:16px 20px;border:2px solid var(--line);border-radius:var(--r);background:#fff}
.who button .ic{font-size:28px;line-height:1}
.who button b{display:block;font-size:19px}
.who button small{color:var(--muted);font-size:14px}
.who button.firm.active{border-color:var(--firm);background:var(--firm-soft)}
.who button.firm.active b{color:#c2410c}
.who button.seek.active{border-color:var(--seek);background:var(--seek-soft)}
.who button.seek.active b{color:#0f766e}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}
.steps button{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:12px;border:2px solid transparent;background:#e7e9ee;font-weight:700;font-size:16px;color:#3b4456}
.steps .num{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:#fff;font-size:15px}
.steps .n{margin-left:auto;font-weight:600;color:var(--muted);font-size:14px}
.steps button.hook.active{background:var(--hook);color:#fff}
.steps button.reply.active{background:var(--reply);color:#fff}
.steps button.follow.active{background:var(--follow);color:#fff}
.steps button.active .num{color:var(--ink)}
.steps button.active .n{color:rgba(255,255,255,.85)}
.steps button:not(.active):hover{background:#dde0e7}
.stephint{margin:-8px 0 18px;color:var(--muted);font-size:15px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.stephint input{max-width:260px;margin-left:auto}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(400px,1fr));gap:18px}
@media(max-width:560px){.grid{grid-template-columns:1fr}}
.tpl{background:#fff;border:1px solid var(--line);border-top:5px solid var(--hook);border-radius:var(--r);display:flex;flex-direction:column;overflow:hidden}
.tpl.reply{border-top-color:var(--reply)} .tpl.follow{border-top-color:var(--follow)}
.tpl-head{padding:16px 18px 0}
.tpl-name{font-weight:800;font-size:18px}
.tpl-subj{padding:4px 18px 0;font-size:14px;color:var(--muted)}
.tpl-subj b{color:var(--ink);font-weight:600}
.tpl-body{padding:12px 18px 16px;white-space:pre-wrap;font-size:16px;line-height:1.62;flex:1}
.tpl-body .sig{color:var(--muted)}
.tpl-body .feat{color:#3b4456}
.post-img{width:100%;display:block;aspect-ratio:1/1;object-fit:cover;background:#141a26}
.post-text{border:none;border-top:1px solid var(--line);border-radius:0;min-height:170px;padding:14px 18px;font-size:15px;line-height:1.6;flex:1}
.tpl-foot a{text-decoration:none}
.film{display:inline-flex;align-items:center;gap:6px;margin:0 18px 12px;padding:5px 10px;border-radius:8px;background:#fee2e2;color:#b91c1c;font-size:13px;font-weight:600;text-decoration:none;align-self:flex-start}
.tpl-foot{display:flex;align-items:center;gap:8px;padding:12px 18px;border-top:1px solid var(--line);background:#fafbfc}
.uses{font-size:13px;color:var(--muted)}
.tpl.editing{border-color:var(--acc);box-shadow:0 0 0 4px var(--acc-soft)}
.tpl.editing .fields{padding:16px 18px;display:grid;gap:12px}
.tpl.editing textarea{min-height:190px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label.f{display:grid;gap:5px;font-size:13px;color:var(--muted);font-weight:700}
details.card summary{cursor:pointer;font-weight:800;font-size:17px;list-style:none;display:flex;align-items:center;gap:10px}
details.card summary::-webkit-details-marker{display:none}
details.card summary::before{content:"+";display:inline-grid;place-items:center;width:26px;height:26px;border-radius:8px;background:var(--acc);color:#fff;font-weight:800}
details.card[open] summary::before{content:"−"}
details.card[open] summary{margin-bottom:14px}
.films{display:grid;gap:6px;margin:6px 0 12px}
.films div{display:flex;gap:8px;align-items:center;padding:6px 10px;border:1px solid var(--line);border-radius:10px;font-size:14px}
.films div span{flex:1}

.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.tabs2{display:inline-flex;gap:8px}
.tabs2 button{font-weight:700;font-size:16px;padding:10px 18px;border-radius:12px;border:2px solid var(--line);background:#fff}
.tabs2 button .n{margin-left:6px;font-weight:600;color:var(--muted)}
.tabs2 button.new.active{background:var(--firm);border-color:var(--firm);color:#fff}
.tabs2 button.sent.active{background:var(--ok);border-color:var(--ok);color:#fff}
.tabs2 button.active .n{color:rgba(255,255,255,.85)}
.search{max-width:260px}
table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
th,td{padding:13px 16px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{background:#fafbfc;color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.4px;font-weight:700}
tr:last-child td{border-bottom:none}
.nm{font-weight:700}
.em{font-family:ui-monospace,Consolas,monospace;font-size:14px;color:var(--muted)}
.actions{white-space:nowrap;text-align:right}
.badge{display:inline-block;padding:4px 10px;border-radius:20px;font-size:13px;font-weight:700;white-space:nowrap}
.b-new{background:var(--firm-soft);color:#c2410c}
.b-sent{background:var(--ok-soft);color:var(--ok)}
.empty{text-align:center;color:var(--muted);padding:48px}
.found{max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:10px;margin:12px 0}
.found label{display:flex;gap:10px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);font-size:15px}
.found label:last-child{border-bottom:none}
.found input{width:auto}
.found .dup{color:var(--muted);text-decoration:line-through}
dialog{border:none;border-radius:16px;padding:0;width:min(680px,94vw);box-shadow:0 20px 60px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(15,20,30,.5)}
dialog .dh{padding:16px 20px;border-bottom:1px solid var(--line);font-weight:800;font-size:17px;display:flex;justify-content:space-between;align-items:center}
dialog .db{padding:18px 20px;display:grid;gap:12px}
dialog .df{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.preview{white-space:pre-wrap;background:#fafbfc;border:1px solid var(--line);border-radius:10px;padding:16px;max-height:300px;overflow:auto;font-size:15px;line-height:1.6}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--head);color:#fff;padding:12px 20px;border-radius:10px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:99;font-size:15px}
.toast.show{opacity:1}
@media(max-width:800px){.hide-m{display:none}.row2,.who{grid-template-columns:1fr}.steps{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <div class="logo">zlecenia<span>laser</span>.pl</div>
  <div class="mainnav" id="nav"></div>
  <div class="spacer"></div>
  <div class="tools">
    <button onclick="exportJSON()">Kopia zapasowa</button>
    <button onclick="document.getElementById('importFile').click()">Wczytaj kopię</button>
  </div>
  <input type="file" id="importFile" accept=".json" style="display:none" onchange="importJSON(this)">
</header>
<main id="main"></main>

<dialog id="dlgContact">
  <form method="dialog" onsubmit="return false">
    <div class="dh"><span id="dcTitle">Nowy adres</span><button class="ghost" onclick="closeDlg('dlgContact')">✕</button></div>
    <div class="db">
      <label class="f">Nazwa (firma albo osoba)<input id="cName"></label>
      <label class="f">E-mail<input id="cEmail" type="email"></label>
      <label class="f">Skąd (np. nazwa grupy FB)<input id="cSource"></label>
      <label class="f">Notatka<textarea id="cNote" rows="2"></textarea></label>
    </div>
    <div class="df"><button onclick="closeDlg('dlgContact')">Anuluj</button><button class="primary" onclick="saveContact()">Zapisz</button></div>
  </form>
</dialog>

<dialog id="dlgSend">
  <form method="dialog" onsubmit="return false">
    <div class="dh"><span id="dsTitle">Napisz maila</span><button class="ghost" onclick="closeDlg('dlgSend')">✕</button></div>
    <div class="db">
      <label class="f">Wiadomość<select id="sTpl" onchange="renderSendPreview()"></select></label>
      <div class="hint">Temat: <b id="sSubject" style="color:var(--ink)"></b></div>
      <div class="preview" id="sPreview"></div>
    </div>
    <div class="df">
      <button onclick="copyFromSend('mail')">Kopiuj adres</button>
      <button onclick="copyFromSend('subject')">Kopiuj temat</button>
      <button onclick="copyFromSend('body')">Kopiuj treść</button>
      <button class="primary" onclick="openMail()">Otwórz w poczcie</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast"></div>

function load(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw){
      const s = JSON.parse(raw);
      if(s && Array.isArray(s.contacts) && Array.isArray(s.templates)){
        s.settings = Object.assign({}, DEFAULT_SETTINGS, {tplVer:1}, s.settings||{});
        if(!Array.isArray(s.films)) s.films = JSON.parse(JSON.stringify(DEFAULT_FILMS));
        if(!Array.isArray(s.posts)) s.posts = JSON.parse(JSON.stringify(DEFAULT_POSTS));
        if(s.settings.tplVer === 3){
          s.templates.forEach(t=>{ const d = DEFAULT_TEMPLATES.find(x=>x.id===t.id); if(d && d.type==='hook') t.features = d.features; });
          s.settings.tplVer = 4;
        }
        if(s.settings.tplVer < 3){
          const OLD = ['A','B','C','D','E','F','FW','FZ'].concat(DEFAULT_TEMPLATES.map(t=>t.id), ['k1','k2','k3','k4','k5','k6','r1','r2','r3','r4','r5','f1','z1','z2','z3','zr1','zr2','zf1']);
          const uses = {}; s.templates.forEach(t=>{ if(t.uses) uses[t.id]=t.uses; });
          const own = s.templates.filter(t=>!OLD.includes(t.id)).map(t=>Object.assign({type:'hook'}, t, {text:(t.text||'').replace('{film}','')}));
          s.templates = JSON.parse(JSON.stringify(DEFAULT_TEMPLATES)).map(t=>Object.assign(t, uses[t.id]?{uses:uses[t.id]}:{})).concat(own);
          delete s.settings.signature; delete s.settings.filmUrl;
          s.settings.tplVer = TPL_VER;
        }
        return s;
      }
    }
  }catch(e){}
  return {contacts:[], templates:JSON.parse(JSON.stringify(DEFAULT_TEMPLATES)), films:JSON.parse(JSON.stringify(DEFAULT_FILMS)), posts:JSON.parse(JSON.stringify(DEFAULT_POSTS)), settings:Object.assign({}, DEFAULT_SETTINGS)};
}

async function copyText(txt, msg){
  let ok=false;
  try{ await navigator.clipboard.writeText(txt); ok=true; }
  catch(e){
    const ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta); ta.select();
    try{ ok=document.execCommand('copy'); }catch(_){}
    ta.remove();
  }
  toast(ok ? (msg||'Skopiowano') : 'Nie udało się skopiować');
  return ok;
}

// ---------- EMAIL EXTRACTION ----------
const EMAIL_RE = /[A-Za-z0-9._%+-]+@[A-Za-z0-9-]+(?:\.[A-Za-z0-9-]+)*\.[A-Za-z]{2,}/g;
const EMAIL_ONE = new RegExp(EMAIL_RE.source);
const SKIP_LINE = /^(\*\s*)?(odpowiedz|udostępnij|edytowano|lubię to!?|reply|share|like)\s*$/i;
function cleanName(line){
  const m = line.match(/^\[([^\]]+)\]\(/);
  return (m ? m[1] : line).trim();
}
function isSep(line){ return /^[·•\s]+$/.test(line) && line.includes('·'); }
function extractEmails(text){
  const lines = text.split(/\r?\n/).map(l=>l.trim());
  const out = []; const seen = new Set();
  let name = '';
  for(let i=0;i<lines.length;i++){
    const l = lines[i];
    if(!l) continue;
    // a line followed by a "·" separator line is the author's name (Facebook comment layout)
    let j=i+1; while(j<lines.length && !lines[j]) j++;
    if(isSep(l) || SKIP_LINE.test(l)) continue;
    if(j<lines.length && isSep(lines[j]) && !EMAIL_ONE.test(l)){ name = cleanName(l); continue; }
    const ms = l.match(EMAIL_RE) || [];
    ms.forEach(e=>{
      e = e.replace(/\.+$/,'').toLowerCase();
      if(seen.has(e)) return; seen.add(e);
      out.push({email:e, name: name || guessName(e)});
    });
  }
  return out;
}
function guessName(e){
  const [local, dom] = e.split('@');
  const free = /^(gmail|onet|wp|o2|interia|op|yahoo|hotmail|outlook|icloud|poczta|tlen|vp|buziaczek|gazeta|protonmail)\./i;
  return free.test(dom) ? local : dom;
}

      <button class="primary" onclick="addFound()">Dodaj zaznaczone</button>
    </div>` : '';

  const rows = list.map(c=>{
    const t = c.tpl ? tplById(c.tpl) : null;
    return `<tr>
      <td><div class="nm">${esc(c.name)}</div><div class="em">${esc(c.email)}</div>${c.note?`<div class="hint">${esc(c.note)}</div>`:''}</td>
      <td class="hide-m"><span class="hint">${esc(c.source)}</span></td>
      <td>${c.sentAt ? `<span class="badge b-sent">✓ wysłano ${fmtDate(c.sentAt)}</span>${t?`<div class="hint">${esc(t.name)}</div>`:''}` : '<span class="badge b-new">do wysłania</span>'}</td>
      <td class="actions">
        <button class="small ${c.sentAt?'':'primary'}" onclick="openSend('${c.id}')">${c.sentAt?'Napisz znowu':'Napisz'}</button>
        <button class="small ghost" onclick="toggleSent('${c.id}')">${c.sentAt?'Cofnij':'Oznacz wysłany'}</button>
        <button class="small ghost" onclick="openContact('${c.id}')">Edytuj</button>
        <button class="small ghost danger" onclick="delContact('${c.id}')" title="Usuń">✕</button>
      </td></tr>`;
  }).join('');

  return `
  <details class="card" ${(!all.length || found.length)?'open':''}>
    <summary>Dodaj maile</summary>
    <div class="hint" style="margin-bottom:10px">Wklej cały skopiowany tekst, np. komentarze spod posta na Facebooku. Panel sam wyciągnie adresy i dopisze nazwę autora komentarza.</div>
    <textarea id="pasteBox" rows="5" placeholder="Wklej tutaj tekst z adresami e-mail…"></textarea>
    <div class="bar" style="margin:12px 0 0">
      <button class="primary" onclick="doExtract()">Wyciągnij maile</button>
      <button onclick="openContact()">Dodaj jeden ręcznie</button>
    </div>
    ${foundHtml}
  </details>
  <div class="bar">
    <div class="tabs2">
      <button class="new ${filters.status==='new'?'active':''}" onclick="filters.status='new';render()">Do wysłania<span class="n">${nNew}</span></button>
      <button class="sent ${filters.status==='sent'?'active':''}" onclick="filters.status='sent';render()">Wysłane<span class="n">${all.length-nNew}</span></button>
    </div>
    <input class="search" placeholder="Szukaj…" value="${esc(filters.q)}" oninput="filters.q=this.value;keepFocusMail('qInput')" id="qInput">
    <div class="spacer"></div>
    <button onclick="copyText(state.contacts.filter(c=>!c.sentAt).map(c=>c.email).join(', '),'Skopiowano adresy do wysłania')">Kopiuj adresy do wysłania</button>
    <button onclick="exportCSV()">Eksport CSV</button>
  </div>
  ${list.length ? `<table>
    <thead><tr><th>Kto</th><th class="hide-m">Skąd</th><th>Status</th><th></th></tr></thead>
    <tbody>${rows}</tbody></table>` : `<div class="card empty">${all.length?(filters.status==='new'?'Wszystko wysłane 👍':'Nic jeszcze nie wysłano.'):'Lista jest pusta. Kliknij „Dodaj maile” i wklej tekst z adresami.'}</div>`}`;
}
function keepFocusMail(id){
  const paste = document.getElementById('pasteBox')?.value;
  keepFocus(id);
  const pb = document.getElementById('pasteBox'); if(pb && paste) pb.value = paste;
}
function doExtract(){
  const txt = document.getElementById('pasteBox').value;
  found = extractEmails(txt);
  if(!found.length){ toast('Nie znalazłem żadnego adresu e-mail'); return; }
  render();
  const pb = document.getElementById('pasteBox'); if(pb) pb.value = txt;
  toast(`Znaleziono ${found.length} adresów`);
}
function addFound(){
  const src = (document.getElementById('srcInput')?.value||'').trim();
  state.settings.source = src;
  const existing = new Set(state.contacts.map(c=>c.email));
  let n=0;
  document.querySelectorAll('.found input[type=checkbox]').forEach(cb=>{
    if(!cb.checked || cb.disabled) return;
    const f = found[+cb.dataset.i];
    if(existing.has(f.email)) return;
    existing.add(f.email);
    state.contacts.push({id:uid(), name:f.name, email:f.email, source:src, note:'', sentAt:'', tpl:'', createdAt:new Date().toISOString()});
    n++;
  });
  found = []; filters.status='new'; save(); render(); toast(`Dodano ${n} adresów`);
}
function openContact(id){
  editingId = id||null;
  const c = id ? state.contacts.find(x=>x.id===id) : {};
  document.getElementById('dcTitle').textContent = id ? 'Edytuj adres' : 'Nowy adres';
  cName.value=c.name||''; cEmail.value=c.email||''; cSource.value=c.source||state.settings.source||''; cNote.value=c.note||'';
  document.getElementById('dlgContact').showModal(); (id?cName:cEmail).focus();
}
function saveContact(){
  const email = cEmail.value.trim().toLowerCase();
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ toast('Podaj poprawny adres e-mail'); cEmail.focus(); return; }
  const data = {name:cName.value.trim()||guessName(email), email, source:cSource.value.trim(), note:cNote.value.trim()};
  if(editingId){ Object.assign(state.contacts.find(x=>x.id===editingId), data); }
  else{
    if(state.contacts.some(x=>x.email===email)){ toast('Ten adres już jest na liście'); return; }
    state.contacts.push(Object.assign({id:uid(), sentAt:'', tpl:'', createdAt:new Date().toISOString()}, data));
  }
  save(); closeDlg('dlgContact'); render(); toast('Zapisano');
}
function delContact(id){
  const c = state.contacts.find(x=>x.id===id);
  if(!confirm(`Usunąć ${c.email}?`)) return;
  state.contacts = state.contacts.filter(x=>x.id!==id); save(); render();
}
function toggleSent(id){
  const c = state.contacts.find(x=>x.id===id);
  c.sentAt = c.sentAt ? '' : today(); save(); render();
}

// ---------- SEND ----------
function openSend(id){
  sendingId = id;
  const c = state.contacts.find(x=>x.id===id);
  document.getElementById('dsTitle').textContent = 'Napisz do: ' + (c.name || c.email);
  let html = '';
  for(const [g,gl] of Object.entries(GROUPS)) for(const [ty,tl] of Object.entries(TYPES)){
    const ts = state.templates.filter(t=>t.group===g && t.type===ty);
    if(ts.length) html += `<optgroup label="${gl}: ${tl}">${ts.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('')}</optgroup>`;
  }
  sTpl.innerHTML = html;
  const pick = c.sentAt ? (state.templates.find(t=>t.group==='wyk' && t.type==='follow')||{}).id : (state.settings.lastTpl || 'k1');
  if(pick && tplById(pick)) sTpl.value = pick;
  renderSendPreview();
  document.getElementById('dlgSend').showModal();
}
function renderSendPreview(){
  const t = tplById(sTpl.value);
  sSubject.textContent = t ? (t.subject||'(bez tematu)') : '';
  sPreview.textContent = t ? fullText(t) : '';
}
function markSent(){
  const c = state.contacts.find(x=>x.id===sendingId);
  const t = tplById(sTpl.value);
  if(!c.sentAt) c.sentAt = today();
  if(t && t.type==='hook'){ c.tpl = t.id; state.settings.lastTpl = t.id; }
  if(t) t.uses = (t.uses||0)+1;
  save();
}
async function copyFromSend(what){
  const c = state.contacts.find(x=>x.id===sendingId);
  const t = tplById(sTpl.value);
  if(what==='mail') await copyText(c.email,'Skopiowano adres');
  if(what==='subject') await copyText(t.subject||'','Skopiowano temat');
  if(what==='body'){ await copyText(fullText(t),'Skopiowano treść'); markSent(); render(); }
}
function openMail(){
  const c = state.contacts.find(x=>x.id===sendingId);
  const t = tplById(sTpl.value); if(!t) return;
  const url = `mailto:${encodeURIComponent(c.email)}?subject=${encodeURIComponent(t.subject||'')}&body=${encodeURIComponent(fullText(t))}`;
  markSent(); closeDlg('dlgSend'); render();
  window.location.href = url;
}

// ---------- IMPORT / EXPORT ----------
function download(name, content, type){
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([content],{type})); a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function exportJSON(){ download(`panel-wysylki-${today()}.json`, JSON.stringify(state,null,2), 'application/json'); toast('Pobrano kopię zapasową'); }
function importJSON(input){
  const f = input.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const s = JSON.parse(r.result);
      if(!Array.isArray(s.contacts) || !Array.isArray(s.templates)) throw 0;
      if(!confirm(`Wczytać kopię (${s.contacts.length} adresów)? Obecne dane w tej przeglądarce zostaną zastąpione.`)) return;
      localStorage.setItem(LS_KEY, JSON.stringify(s));
      state = load(); save(); render(); toast('Wczytano kopię');
    }catch(e){ toast('To nie jest plik kopii z tego panelu'); }
    input.value='';
  };
  r.readAsText(f);
}
function exportCSV(){
  const q = v => `"${String(v??'').replace(/"/g,'""')}"`;
  const head = ['Nazwa','E-mail','Skąd','Wysłano','Wiadomość','Notatka'];
  const lines = state.contacts.map(c=>[c.name,c.email,c.source,c.sentAt,(tplById(c.tpl)||{}).name||'',c.note].map(q).join(';'));
  download(`maile-${today()}.csv`, '﻿'+[head.map(q).join(';'),...lines].join('\r\n'), 'text/csv;charset=utf-8');
}

// ---------- RENDER ----------
function render(){
  renderNav();
  document.getElementById('main').innerHTML = view==='mail' ? renderMails() : view==='posts' ? renderPosts() : renderTemplates();
}
render();
</script>
</body>
</html>
